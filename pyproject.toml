[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "football-intelligence-copilot"
version = "0.1.0"
description = "A learning-first local football intelligence copilot built around MCP and LangGraph."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.12,<3",
  "python-dotenv>=1.1,<2",
]

[project.scripts]
football-api-probe = "football_copilot.api_probe:main"

[dependency-groups]
dev = [
  "anyio>=4.14,<5",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/football_copilot"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
